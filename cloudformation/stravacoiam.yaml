AWSTemplateFormatVersion: "2010-09-09"
Description: >
  CloudFormation stack to create IAM Groups with defined access policies and
  IAM Users assigned to those groups. Developer_Group includes a Deny policy
  for destructive actions against Production-tagged resources. All groups carry
  Environment tags (Development | Production).

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:
  Environment:
    Type: String
    Default: Development
    AllowedValues:
      - Development
      - Production
    Description: >
      Deployment environment tag applied to IAM users. For Developer_Group,
      the Deny policy targets resources tagged Environment=Production regardless
      of this parameter value.

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # =========================================================================
  # 1. DEVELOPER GROUP
  # =========================================================================
  DeveloperGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: Developer_Group
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2FullAccess
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        - arn:aws:iam::aws:policy/CloudWatchEventsFullAccess

  # Inline policy: Deny destructive actions when the target resource is tagged
  # Environment=Production; allow the same actions when tagged Development.
  DeveloperGroupProductionDenyPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: Developer_Group_ProductionDestructiveDeny
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyEC2DestructiveOnProduction
            Effect: Deny
            Action:
              - ec2:TerminateInstances
              - ec2:StopInstances
              - ec2:RebootInstances
              - ec2:DeleteVolume
              - ec2:DeleteSnapshot
              - ec2:DeleteSecurityGroup
              - ec2:DeleteSubnet
              - ec2:DeleteVpc
              - ec2:DeleteInternetGateway
              - ec2:DeleteRouteTable
              - ec2:DeleteRoute
              - ec2:DeleteNetworkAcl
              - ec2:DeleteKeyPair
              - ec2:DeleteLaunchTemplate
            Resource: "*"
            Condition:
              StringEquals:
                "aws:ResourceTag/Environment": "Production"

          - Sid: DenyS3DestructiveOnProduction
            Effect: Deny
            Action:
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - s3:DeleteBucket
              - s3:DeleteBucketPolicy
              - s3:DeleteBucketWebsite
              - s3:PutBucketPolicy
              - s3:PutLifecycleConfiguration
            Resource: "*"
            Condition:
              StringEquals:
                "aws:ResourceTag/Environment": "Production"

          - Sid: AllowEC2DestructiveOnDevelopment
            Effect: Allow
            Action:
              - ec2:TerminateInstances
              - ec2:StopInstances
              - ec2:RebootInstances
              - ec2:DeleteVolume
              - ec2:DeleteSnapshot
              - ec2:DeleteSecurityGroup
              - ec2:DeleteSubnet
              - ec2:DeleteVpc
              - ec2:DeleteInternetGateway
              - ec2:DeleteRouteTable
              - ec2:DeleteRoute
              - ec2:DeleteNetworkAcl
              - ec2:DeleteKeyPair
              - ec2:DeleteLaunchTemplate
            Resource: "*"
            Condition:
              StringEquals:
                "aws:ResourceTag/Environment": "Development"

          - Sid: AllowS3DestructiveOnDevelopment
            Effect: Allow
            Action:
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - s3:DeleteBucket
              - s3:DeleteBucketPolicy
              - s3:DeleteBucketWebsite
              - s3:PutBucketPolicy
              - s3:PutLifecycleConfiguration
            Resource: "*"
            Condition:
              StringEquals:
                "aws:ResourceTag/Environment": "Development"
      Groups:
        - !Ref DeveloperGroup

  # =========================================================================
  # 2. OPS GROUP
  # =========================================================================
  OpsGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: Ops_Group
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2FullAccess
        - arn:aws:iam::aws:policy/CloudWatchEventsFullAccess
        - arn:aws:iam::aws:policy/AmazonSSMFullAccess
        - arn:aws:iam::aws:policy/AmazonRDSFullAccess

  # =========================================================================
  # 3. FINANCE GROUP
  # =========================================================================
  FinanceGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: Finance_Group
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/job-function/Billing
        - arn:aws:iam::aws:policy/ReadOnlyAccess

  # =========================================================================
  # 4. DATA GROUP
  # =========================================================================
  DataGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: Data_Group
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
        - arn:aws:iam::aws:policy/AmazonRDSReadOnlyAccess

  # =========================================================================
  # 5. STRAVACO ADMIN GROUP
  # =========================================================================
  StavacoAdminGroup:
    Type: AWS::IAM::Group
    Properties:
      GroupName: Stravaco_Admin_Group
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess
        - arn:aws:iam::aws:policy/AmazonS3FullAccess
        - arn:aws:iam::aws:policy/AWSBillingConductorFullAccess
        - arn:aws:iam::aws:policy/job-function/Billing
        - arn:aws:iam::aws:policy/IAMUserChangePassword

